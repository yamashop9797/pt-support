<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PTサポート">
  <meta name="theme-color" content="#f2f4f7">
  <meta name="robots" content="noindex">
  <title>PTサポート</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main" class="main"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>今日</span>
    </a>
    <a href="#/week" data-tab="week">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>今週</span>
    </a>
    <a href="#/patients" data-tab="patients">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg>
      <span>患者</span>
    </a>
    <a href="#/calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>カレンダー</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="lock" class="lock" hidden></div>

  <noscript>このアプリを使うには JavaScript をオンにしてください。</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
